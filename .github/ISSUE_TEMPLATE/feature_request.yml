name: Feature request
description: Suggest an idea for this project
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a great idea for a new skill or feature? Tell us about it!
  - type: textarea
    id: feature-description
    attributes:
      label: Description of the feature
      placeholder: I would like to see...
    validations:
      required: true
  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      placeholder: This would be useful when...
    validations:
      required: true
